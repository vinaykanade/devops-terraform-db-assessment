services:
  postgres:
    image: postgres:16
    container_name: hotel_postgres
    environment:
      POSTGRES_DB: hotelbooking
      POSTGRES_USER: hoteladmin
      POSTGRES_PASSWORD: hotelpass
    ports:
      - "5432:5432"
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data

volumes:
  hotel_postgres_data: